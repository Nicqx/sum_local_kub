apiVersion: apps/v1
kind: Deployment
metadata:
  name: sum-local
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: sum-local
  template:
    metadata:
      labels:
        app: sum-local
    spec:
      containers:
      - name: sum-local
        image: sum_local:1.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_KEY_PREFIX
          value: "sumplete:session"
        - name: SESSION_TTL_SECONDS
          value: "3600"
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sum-local-service
spec:
  type: ClusterIP
  selector:
    app: sum-local
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: http
