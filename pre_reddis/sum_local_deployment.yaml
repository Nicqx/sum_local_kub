apiVersion: apps/v1
kind: Deployment
metadata:
  name: sum-local
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sum-local
  template:
    metadata:
      labels:
        app: sum-local
    spec:
      containers:
      - name: sum-local
        image: sum_local:latest
        ports:
        - containerPort: 8080
          hostPort: 8080
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: public-folder
          mountPath: /app/public
      volumes:
      - name: public-folder
        hostPath:
          path: /home/user/sum_local_kub/public
          type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: sum-local-service
spec:
  selector:
    app: sum-local
  ports:
  - protocol: TCP
    port: 8080         # A Service által elérhető port a klaszteren belül
    targetPort: 8080   # A konténerben futó alkalmazás portja
  type: ClusterIP
